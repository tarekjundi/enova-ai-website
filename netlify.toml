
[build]
  command = "npm run build"
  publish = "dist"

# This ensures that all routes are handled by the index.html file for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Enable the Netlify Visual Editor
[build.environment]
  NETLIFY_USE_EDGE = "true"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Explicitly set processing for the Visual Editor
[[plugins]]
  package = "@netlify/plugin-nextjs"
  
# Ensure proper edge function configuration
[functions]
  directory = "netlify/functions"
